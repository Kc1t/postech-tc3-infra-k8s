name: Terraform

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false

      - run: terraform validate

      - uses: aquasecurity/tfsec-action@v1.0.3

  plan:
    name: Plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend-config="key=k8s/staging.tfstate" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ secrets.AWS_REGION }}"

      - run: terraform plan -var-file=envs/staging.tfvars

  # Apply so na main. O cluster e unico, com um namespace por ambiente (ADR-0010): a homolog e
  # validada pelo Validate, e um apply nela criaria um segundo cluster.
  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment
        run: echo "TF_ENV=${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> $GITHUB_ENV

      - run: terraform init -backend-config="key=k8s/${TF_ENV}.tfstate" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ secrets.AWS_REGION }}"

      - run: terraform apply -auto-approve -var-file=envs/${TF_ENV}.tfvars

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --region "${{ secrets.AWS_REGION }}" --name "$(terraform output -raw cluster_name)"

      - name: Instalar o agente do New Relic
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -z "$NEW_RELIC_LICENSE_KEY" ]; then
            echo "NEW_RELIC_LICENSE_KEY nao configurada, pulando a instalacao do agente"
            exit 0
          fi
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --values helm/newrelic-values.yaml \
            --set global.licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --set global.cluster="$CLUSTER_NAME" \
            --wait --timeout 10m

      - name: Publicar o endpoint do gateway
        run: |
          {
            echo "### API Gateway"
            echo '```'
            terraform output -raw api_gateway_endpoint
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
